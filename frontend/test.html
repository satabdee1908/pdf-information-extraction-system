<!DOCTYPE html>
<html>
<head>
    <title>Test Frontend</title>
</head>
<body>

<h1>PDF Extractor Test</h1>

<input type="file" id="fileInput">
<button type="button" id="uploadBtn">Upload</button>
<p id="loading"></p>
<pre id="result" style="background:#111;color:white;padding:20px;white-space:pre-wrap;">
Result will appear here...
</pre>

<script>
document.getElementById("uploadBtn").onclick = async function () {
    alert("Button clicked");

    const fileInput = document.getElementById("fileInput");
    const loading = document.getElementById("loading");
    const result = document.getElementById("result");

    if (!fileInput.files.length) {
        alert("Please select a file");
        return;
    }

    loading.innerText = "Processing...";
    result.innerText = "";

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    try {
        const response = await fetch("http://127.0.0.1:8000/extract-text", {
            method: "POST",
            body: formData
        });

        const text = await response.text();

        loading.innerText = "Done";
        result.innerText = text;

    } catch (error) {
        loading.innerText = "Error";
        result.innerText = error.message;
    }
};
</script>

</body>
</html>
